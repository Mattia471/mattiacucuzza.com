name: Bug report
description: Report a reproducible issue with the portfolio.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please keep reports focused and do not include private client data or credentials.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
      placeholder: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Scroll to ...
        3. Click ...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Chrome 156 · Windows 11 / iPhone 16 Pro · iOS"

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
      description: Add screenshots, recordings or any other useful context.
